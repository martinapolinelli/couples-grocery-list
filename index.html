<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lista Spesa</title>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
 
const firebaseConfig = {
  apiKey: "AIzaSyAID-OXBn5-TiwAvpsCp25Op9lIQ_Ddiu8",
  authDomain: "couples-grocery-list.firebaseapp.com",
  databaseURL: "https://couples-grocery-list-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "couples-grocery-list",
  storageBucket: "couples-grocery-list.firebasestorage.app",
  messagingSenderId: "532618598010",
  appId: "1:532618598010:web:d9aa389fddb49195898dc3",
  measurementId: "G-8YYFMQ6PS3"
};
 
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const auth = getAuth(app);
  const listRef = ref(db, 'lista-spesa/items');
 
  window.__firebaseList = {
    listen: (callback) => onValue(listRef, (snap) => callback(snap.val() || [])),
    save: (items) => set(listRef, items)
  };
  window.__firebaseAuth = {
    login: (email, pass) => signInWithEmailAndPassword(auth, email, pass),
    logout: () => signOut(auth),
    onChange: (callback) => onAuthStateChanged(auth, callback)
  };
  window.dispatchEvent(new Event('firebase-ready'));
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@1,700;1,900&family=Nunito:wght@400;500;600;700;800&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F1F4;
    --surface:#FFFFFF;
    --ink:#181318;
    --ink-soft:#6E6373;
    --accent:#9E6EB8;
    --accent-dark:#71468C;
    --done:#7FAE8C;
    --danger:#B87A9A;
    --witchy:#C9A3DC;
    --line: rgba(24,19,24,0.22);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#161217;
      --surface:#211C24;
      --ink:#F4F1F4;
      --ink-soft:#B3A9BB;
      --accent:#C9A3DC;
      --accent-dark:#E0C4EE;
      --done:#9FCBAA;
      --danger:#E3A9C4;
      --witchy:#C9A3DC;
      --line: rgba(244,241,244,0.22);
    }
  }
  *{box-sizing:border-box;}
  html{color-scheme:light dark; background:var(--bg);}
  html,body{margin:0;padding:0;}
  body{
    background:
      repeating-linear-gradient(0deg, rgba(24,19,24,0.05) 0 1.5px, transparent 1.5px 30px),
      repeating-linear-gradient(90deg, rgba(24,19,24,0.05) 0 1.5px, transparent 1.5px 30px),
      radial-gradient(circle at 6% 8%, rgba(158,110,184,0.16) 0, transparent 40%),
      radial-gradient(circle at 95% 90%, rgba(127,174,140,0.18) 0, transparent 42%),
      var(--bg);
    font-family:'Nunito', sans-serif;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:24px 14px 60px;
  }
  .app{
    width:100%;
    max-width:460px;
  }
  header{
    text-align:center;
    margin-bottom:22px;
    position:relative;
    padding-top:6px;
  }
  h1{
    font-family:'Bodoni Moda', serif;
    font-style:italic;
    font-weight:900;
    font-size:50px;
    margin:0;
    color:var(--ink);
    letter-spacing:-0.01em;
    display:inline-block;
  }
  .cart-emoji{
    display:inline-block;
    transform:rotate(8deg);
    margin-left:4px;
    filter:saturate(0.9);
  }
  .subtitle{
    font-family:'Playfair Display', serif;
    font-style:italic;
    font-size:14px;
    color:var(--witchy);
    margin-top:6px;
    letter-spacing:0.03em;
    font-weight:400;
  }
  .subtitle::before{
    content:'✿';
    font-family:'Nunito',sans-serif;
    color:var(--accent);
    font-size:10px;
    margin:0 8px;
    position:relative;
    top:-2px;
  }
  .subtitle::after{
    content:'✿';
    font-family:'Nunito',sans-serif;
    color:var(--done);
    font-size:10px;
    margin:0 8px;
    position:relative;
    top:-2px;
  }
  .name-row{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:6px;
    margin-top:10px;
    font-size:12.5px;
    color:var(--ink-soft);
  }
  .name-row button{
    background:none;
    border:none;
    color:var(--accent-dark);
    font-weight:700;
    cursor:pointer;
    font-size:12.5px;
    text-decoration:underline;
    padding:0;
    font-family:'Nunito',sans-serif;
  }
  .add-form{
    display:flex;
    gap:8px;
    margin-bottom:20px;
  }
  .add-form input{
    flex:1;
    border:2px dashed var(--ink);
    background:var(--surface);
    border-radius:16px 14px 18px 12px;
    padding:13px 16px;
    font-size:15px;
    font-family:'Nunito',sans-serif;
    color:var(--ink);
    outline:none;
    transition:border-color 0.15s ease;
  }
  .add-form input:focus{
    border-color:var(--accent);
    border-style:solid;
  }
  .add-form button{
    background:var(--ink);
    color:#fff;
    border:none;
    border-radius:50%;
    width:48px;
    height:48px;
    padding:0;
    font-size:22px;
    font-weight:700;
    cursor:pointer;
    transition:transform 0.15s ease;
    line-height:1;
    position:relative;
    box-shadow:
      0 -19px 0 -13px var(--accent),
      13px -14px 0 -13px var(--done),
      19px 0 0 -13px var(--accent),
      13px 14px 0 -13px var(--done),
      0 19px 0 -13px var(--accent),
      -13px 14px 0 -13px var(--done),
      -19px 0 0 -13px var(--accent),
      -13px -14px 0 -13px var(--done);
  }
  .add-form button:active{
    transform:scale(0.92) rotate(-8deg);
  }
  .add-form button:hover{
    background:var(--accent-dark);
  }
  .list-card{
    background:var(--surface);
    border-radius:16px;
    padding:6px 4px;
    box-shadow:0 4px 18px rgba(24,19,24,0.16);
    border:1.5px solid var(--ink);
    min-height:80px;
    position:relative;
  }
  .item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:13px 14px;
    border-bottom:1px dashed var(--line);
    position:relative;
  }
  .item:last-child{
    border-bottom:none;
  }
  .checkbox{
    width:23px;
    height:23px;
    border-radius:50%;
    border:2px solid var(--ink-soft);
    flex-shrink:0;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:all 0.15s ease;
    background:transparent;
  }
  .checkbox.checked{
    background:var(--done);
    border-color:var(--done);
  }
  .checkbox.checked::after{
    content:'✿';
    color:#fff;
    font-size:13px;
    font-weight:700;
  }
  .item-text-wrap{
    flex:1;
    position:relative;
    cursor:pointer;
    min-width:0;
  }
  .item-text{
    font-size:15.5px;
    font-weight:500;
    color:var(--ink);
    word-break:break-word;
  }
  .item.checked .item-text{
    color:var(--ink-soft);
  }
  .strike{
    position:absolute;
    left:-2%;
    top:48%;
    width:0%;
    height:14px;
    pointer-events:none;
    overflow:hidden;
    opacity:0;
    transition:width 0.25s ease, opacity 0.15s ease;
  }
  .item.checked .strike{
    width:104%;
    opacity:1;
  }
  .strike svg{width:100%;height:100%;display:block;}
  .added-by{
    font-size:10.5px;
    color:var(--ink-soft);
    opacity:0.65;
    margin-top:1px;
  }
  .del-btn{
    background:none;
    border:none;
    color:var(--ink-soft);
    font-size:18px;
    cursor:pointer;
    padding:4px 6px;
    flex-shrink:0;
    opacity:0.5;
    transition:opacity 0.15s ease, color 0.15s ease;
  }
  .del-btn:hover{
    opacity:1;
    color:var(--danger);
  }
  .empty{
    text-align:center;
    padding:40px 20px;
    color:var(--ink-soft);
    font-size:14px;
  }
  .empty .big{
    font-size:34px;
    display:block;
    margin-bottom:8px;
  }
  footer{
    text-align:center;
    margin-top:18px;
    font-size:11.5px;
    color:var(--ink-soft);
    opacity:0.7;
  }
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
  .login-screen{
    max-width:340px;
    margin:60px auto 0;
    text-align:center;
  }
  .login-screen h1{
    margin-bottom:20px;
  }
  .login-screen form{
    display:flex;
    flex-direction:column;
    gap:10px;
    background:var(--surface);
    padding:22px 20px;
    border-radius:6px;
    box-shadow:0 3px 16px rgba(60,74,46,0.10);
    border:1px dashed var(--witchy);
  }
  .login-screen input{
    border:2px solid var(--line);
    border-radius:10px;
    padding:12px 14px;
    font-size:15px;
    font-family:'Nunito',sans-serif;
    outline:none;
  }
  .login-screen input:focus{
    border-color:var(--witchy);
  }
  .login-screen button{
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:10px;
    padding:12px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    font-family:'Nunito',sans-serif;
  }
  .login-screen button:hover{
    background:var(--witchy);
  }
  .login-error{
    color:var(--danger);
    font-size:13px;
    min-height:18px;
  }
  .logout-btn{
    background:none;
    border:none;
    color:var(--ink-soft);
    font-size:12px;
    text-decoration:underline;
    cursor:pointer;
    font-family:'Nunito',sans-serif;
  }
</style>
</head>
<body>
 
<div class="login-screen" id="loginScreen">
  <h1 style="font-family:'Caveat',cursive;font-size:44px;">Lista Spesa🔒</h1>
  <form id="loginForm">
    <input type="email" id="loginEmail" placeholder="Email" autocomplete="username" required>
    <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password" required>
    <button type="submit">Login</button>
    <div class="login-error" id="loginError"></div>
  </form>
</div>
 
<div class="app" id="appScreen" style="display:none;">
  <header>
    <h1>Lista Spesa<span class="cart-emoji">🛒</span></h1>
    <div class="subtitle">condivisa e aggiornata</div>
    <div class="name-row">
      <span id="whoami">Stai scrivendo come <strong id="whoamiName">...</strong></span>
      <button id="changeName">cambia</button>
      <span>·</span>
      <button class="logout-btn" id="logoutBtn">logout</button>
    </div>
  </header>
 
  <form class="add-form" id="addForm">
    <input type="text" id="itemInput" placeholder="Aggiungi un prodotto..." autocomplete="off">
    <button type="submit">+</button>
  </form>
 
  <div class="list-card" id="listCard">
    <div class="empty" id="emptyState" style="display:none;">
      <span class="big">🥬</span>
      Niente da comprare...<br>Serve qualcosa? Aggiungilo!
    </div>
    <div id="itemsContainer"></div>
  </div>
 
 
  <footer>Buona spesa</footer>
</div>
 
<script>
const NAME_KEY = 'lista-spesa-mio-nome';
let myName = null;
let items = [];
 
function squiggle(){
  return '<svg viewBox="0 0 300 14" preserveAspectRatio="none"><path d="M2,7 Q 20,2 40,8 T 80,7 T 120,8 T 160,6 T 200,8 T 240,7 T 280,7 T 298,7" fill="none" stroke="#9AAE6F" stroke-width="2.5" stroke-linecap="round"/></svg>';
}
 
function ensureName(){
  myName = localStorage.getItem(NAME_KEY);
  if(!myName){
    myName = promptForName();
  }
  document.getElementById('whoamiName').textContent = myName;
}
 
function promptForName(){
  let n = '';
  while(!n){
    n = window.prompt('Chi sei? (per sapere chi ha aggiunto cosa)', '');
    if(n === null){ n = 'Tu'; break; }
    n = n.trim();
  }
  localStorage.setItem(NAME_KEY, n);
  return n;
}
 
document.getElementById('changeName').addEventListener('click', ()=>{
  const n = window.prompt('Come ti chiami?', myName || '');
  if(n && n.trim()){
    myName = n.trim();
    document.getElementById('whoamiName').textContent = myName;
    localStorage.setItem(NAME_KEY, myName);
  }
});
 
function saveItems(){
  window.__firebaseList.save(items).catch(e => console.error('Errore salvataggio', e));
}
 
function render(){
  const container = document.getElementById('itemsContainer');
  const empty = document.getElementById('emptyState');
  if(items.length === 0){
    empty.style.display = 'block';
    container.innerHTML = '';
    return;
  }
  empty.style.display = 'none';
  container.innerHTML = items.map(it => `
    <div class="item ${it.checked ? 'checked' : ''}" data-id="${it.id}">
      <div class="checkbox ${it.checked ? 'checked' : ''}" data-action="toggle" data-id="${it.id}"></div>
      <div class="item-text-wrap" data-action="toggle" data-id="${it.id}">
        <div class="item-text">${escapeHtml(it.text)}</div>
        ${it.addedBy ? `<div class="added-by">${escapeHtml(it.addedBy)}</div>` : ''}
        <div class="strike">${squiggle()}</div>
      </div>
      <button class="del-btn" data-action="delete" data-id="${it.id}">✕</button>
    </div>
  `).join('');
}
 
function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}
 
document.getElementById('itemsContainer').addEventListener('click', async (e)=>{
  const target = e.target.closest('[data-action]');
  if(!target) return;
  const id = target.dataset.id;
  const action = target.dataset.action;
  if(action === 'toggle'){
    const it = items.find(i => i.id === id);
    if(it) it.checked = !it.checked;
    render();
    await saveItems();
  } else if(action === 'delete'){
    items = items.filter(i => i.id !== id);
    render();
    await saveItems();
  }
});
 
document.getElementById('addForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const input = document.getElementById('itemInput');
  const text = input.value.trim();
  if(!text) return;
  items.unshift({
    id: 'i' + Date.now() + Math.random().toString(36).slice(2,7),
    text,
    checked:false,
    addedBy: myName
  });
  input.value = '';
  render();
  await saveItems();
});
 
function init(){
  const startApp = () => {
    ensureName();
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('appScreen').style.display = 'block';
    window.__firebaseList.listen((data) => {
      items = Array.isArray(data) ? data.filter(Boolean) : (data ? Object.values(data) : []);
      render();
    });
  };
 
  const setupAuth = () => {
    window.__firebaseAuth.onChange((user) => {
      if(user){
        startApp();
      } else {
        document.getElementById('loginScreen').style.display = 'block';
        document.getElementById('appScreen').style.display = 'none';
      }
    });
  };
 
  if(window.__firebaseAuth){
    setupAuth();
  } else {
    window.addEventListener('firebase-ready', setupAuth, { once:true });
  }
}
 
document.getElementById('loginForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPassword').value;
  const errorEl = document.getElementById('loginError');
  errorEl.textContent = '';
  try{
    await window.__firebaseAuth.login(email, pass);
  }catch(err){
    errorEl.textContent = 'Email o password non corrette.';
  }
});
 
document.getElementById('logoutBtn').addEventListener('click', ()=>{
  window.__firebaseAuth.logout();
});
 
init();
</script>
</body>
</html>
